<section id="hero" #heroWrapper class="hero-wrapper">
  <canvas #heroSkyCanvas class="hero-canvas"></canvas>
  <div class="hero-vignette"></div>
  <div class="hero-glow"></div>

  <div class="hero-center">
    <div class="editorial-sig">
      <span class="editorial-slashes">//</span>
      <span>Mateus de Jesus</span>
    </div>

    <h1 class="hero-h1">
      Desenvolvedor de Software<br class="hide-mobile" />
      e Soluções Inteligentes
    </h1>

    <p class="hero-subtitle">
      Foco em criação de <strong>soluções corporativas</strong>,
      automação de processos e <strong>transformação digital</strong>.
    </p>

    <div class="hero-ctas">
      <a href="#projects" class="btn-primary-mono">
        <span>Ver Projetos</span>
        <span aria-hidden="true">↗</span>
      </a>
      <a href="#contact" class="btn-outline-mono">
        <span>Contato</span>
      </a>
    </div>

    <div class="hero-socials">
      <a href="https://www.linkedin.com/in/mateus-de-jesus-da-silva-666045234/" target="_blank"
        rel="noopener noreferrer" class="icon-btn-sq" title="LinkedIn" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
          <rect x="2" y="9" width="4" height="12"></rect>
          <circle cx="4" cy="4" r="2"></circle>
        </svg>
      </a>
      <a href="https://github.com/Mateus-Jesus-MJ" target="_blank" rel="noopener noreferrer" class="icon-btn-sq"
        title="GitHub" aria-label="GitHub">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
          </path>
        </svg>
      </a>
    </div>
  </div>

  <div class="hero-techs">
    @for (tech of heroTechs; track tech.name) {
    <span class="tech-icon-item" [title]="tech.name" [attr.aria-label]="tech.name">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
        stroke-linecap="round" stroke-linejoin="round">
        <path [attr.d]="tech.icon"></path>
      </svg>
    </span>
    }
  </div>
</section>
