<header class="top-nav-wrap">
  <div class="top-nav-inner">
    <a href="#hero" class="brand-link" (click)="closeMobileMenu()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="brand-icon">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
      <span class="brand-text">mateus.dev</span>
    </a>

    <nav class="nav-links" aria-label="Navegação principal">
      <a href="#hero">Home</a>
      <a href="#about">Sobre</a>
      <a href="#projects">Projetos</a>
      <a href="#stack">Stack</a>
      <a href="#experience">Experiência</a>
      <a href="#qualifications">Qualificações</a>
      <a href="#contact">Contato</a>
    </nav>

    <div class="nav-actions">
      <button type="button" (click)="toggleTheme()" class="icon-btn-sq" title="Alternar Dark / Light" aria-label="Alternar tema">
        @if (themeService.isDark) {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>

      <button type="button" (click)="toggleMobileMenu()" class="icon-btn-sq mobile-only" aria-label="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  @if (isMobileMenuActive) {
    <div class="mobile-drawer">
      <a href="#hero" (click)="closeMobileMenu()">Home</a>
      <a href="#about" (click)="closeMobileMenu()">Sobre</a>
      <a href="#projects" (click)="closeMobileMenu()">Projetos</a>
      <a href="#stack" (click)="closeMobileMenu()">Stack</a>
      <a href="#experience" (click)="closeMobileMenu()">Experiência</a>
      <a href="#qualifications" (click)="closeMobileMenu()">Qualificações</a>
      <a href="#contact" (click)="closeMobileMenu()">Contato</a>
    </div>
  }
</header>
